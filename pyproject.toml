[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-semcache"
version = "0.4.5"
description = "Ultra-lightweight semantic caching middleware for FastAPI APIs and LLM endpoints"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "cache",
    "embedding",
    "embeddings",
    "fastapi",
    "llm",
    "pgvector",
    "redis",
    "semantic-cache",
    "semantic cache",
    "vector",
    "middleware",
    "asgi",
    "similarity-search",
    "llm-cache",
    "openai-cache",
    "cost-reduction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]
dependencies = [
    "starlette>=0.46.0",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>=3.3.0",
]

# PyPI serves CPU torch wheels by default. For CUDA, install with PyTorch's index (README).
[project.optional-dependencies]
proxy = ["aiohttp>=3.9", "fastapi>=0.136.1"]
redis = ["redis>=7.4.0"]
embed-huggingface = ["sentence-transformers>=3.0", "torch>=2.1.0"]
embed-openai = ["openai>=1.40", "tiktoken>=0.7"]
embed-ollama = ["openai>=1.40"]
embed-voyage = ["voyageai>=0.3.1", "aiohttp>=3.9"]
embed-cohere = ["cohere>=5.0"]
test = [
    "aiohttp>=3.9",
    "fastapi>=0.136.1",
    "httpx>=0.27.0",
    "numpy>=1.24",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/axm1647/fastapi-semcache"
Repository = "https://github.com/axm1647/fastapi-semcache"
Issues = "https://github.com/axm1647/fastapi-semcache/issues"
Documentation = "https://fastapi-semcache.readthedocs.io/en/latest"
Changelog = "https://github.com/axm1647/fastapi-semcache/releases"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["semanticcache*", "fastapi_semcache*"]

[tool.setuptools.package-data]
semanticcache = ["py.typed", "*.pyi"]
fastapi_semcache = ["*.pyi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: requires sentence-transformers, downloads or uses cached models",
]

[tool.basedpyright]
include = ["semanticcache", "fastapi_semcache.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
